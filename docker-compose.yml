name: dentissa

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-dentissa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dentissa}
      POSTGRES_DB: ${DATABASE_NAME:-dentissa}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-consultorio-dental
    restart: unless-stopped
    environment:
      # Dentro de la red de Docker el host de la base de datos es el servicio "db"
      DATABASE_URL: postgresql://${DATABASE_USER:-dentissa}:${DATABASE_PASSWORD:-dentissa}@db:5432/${DATABASE_NAME:-dentissa}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 caracteres aleatorios) en .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD (minimo 10 caracteres) en .env}
      PORT: 3000
      # Opcionales. Sin SMTP_* la recuperacion de contraseña responde 503.
      FRONTEND_URL: ${FRONTEND_URL:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      # El CORS del backend solo acepta http://localhost:5173 y el frontend
      # llama a http://localhost:3000: no cambies estos puertos sin ajustar ambos
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-consultorio-dental
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

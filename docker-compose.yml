name: dentissa

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-dentissa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dentissa}
      POSTGRES_DB: ${DATABASE_NAME:-dentissa}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-consultorio-dental
    restart: unless-stopped
    environment:
      # Dentro de la red de Docker el host de la base de datos es el servicio "db"
      DATABASE_URL: postgresql://${DATABASE_USER:-dentissa}:${DATABASE_PASSWORD:-dentissa}@db:5432/${DATABASE_NAME:-dentissa}
      JWT_SECRET: ${JWT_SECRET:-dentissa-dev-secret-cambiar}
      PORT: 3000
    ports:
      # El CORS del backend solo acepta http://localhost:5173 y el frontend
      # llama a http://localhost:3000: no cambies estos puertos sin ajustar ambos
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-consultorio-dental
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

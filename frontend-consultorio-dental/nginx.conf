server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos con hash generados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA: el service worker y el manifiesto nunca deben quedar en caché del navegador
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA: cualquier ruta de react-router (/dashboard, /pacientes/1, ...) sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

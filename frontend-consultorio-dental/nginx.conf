server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos con hash generados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de react-router (/dashboard, /pacientes/1, ...) sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
